<!DOCTYPE html>
<html>
<head>
    <title>Online Examination</title>
</head>
<body>

    <h2>Online Examination System</h2>

    <div id="login">
        Name:
        <input type="text" id="name"><br><br>

        Password:
        <input type="password" id="pass"><br><br>

        <button onclick="login()">Login</button>
    </div>

    <div id="exam" hidden>

        <h3>Questions</h3>

        <p>1. HTML stands for?</p>
        <input type="radio" name="q1" value="1"> Hyper Text Markup Language<br>
        <input type="radio" name="q1" value="0"> High Text Machine Language<br>

        <p>2. Which language is used for styling?</p>
        <input type="radio" name="q2" value="1"> CSS<br>
        <input type="radio" name="q2" value="0"> Java<br><br>

        <button onclick="calculate()">Submit</button>

    </div>

    <h3 id="result"></h3>

    <script src="login.js"></script>
    <script src="exam.js"></script>
    <script src="result.js"></script>

</body>
</html>
